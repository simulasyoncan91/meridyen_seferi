<!doctype html>
<html lang="tr">
<head>

<body>
<header id="durum" aria-label="Durum çubuğu">
  <div class="marka"><span class="nokta" aria-hidden="true"></span><span aria-hidden="true">MERİDYEN OS</span><span id="d-surum" class="surum" hidden></span></div>
  <button id="d-sistem" class="sistem-dugme" type="button" aria-label="Sistem: güncellemeler ve görünüm">Sistem</button>

  <div id="d-kaynak" class="d-kaynak"></div>

<main id="calisma">
  <section id="masaustu" aria-label="Masaüstü">
    <div class="karsilama">
      <img class="logo" src="simgeler/logo.svg" alt="" width="56" height="56" onerror="this.remove()"><h1>Üs Bilgisayarı</h1>
      <p id="m-alt" class="soluk">Bağlantı bekleniyor…</p>
      <div id="m-hedef" class="kart" hidden></div>
      <div id="m-kisisel" class="kart" hidden></div>
      <div id="m-haber" class="kart haber" hidden></div>
    </div>
  </section>
</main>

<nav id="serit" aria-label="Açık pencereler" hidden></nav>
<div id="oynatici" hidden></div>
<footer id="dock" aria-label="Uygulama rıhtımı"></footer>

<div id="guncelleme" hidden role="status" aria-live="polite"></div>
<div id="bildirimler" aria-live="polite"></div>
<div id="ortu" hidden><div id="ortu-kutu" role="dialog" aria-modal="true"></div></div>

<script src="tasiyici.js"></script>
<script src="atlas.js"></script>
<script src="telsiz.js"></script>
